<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title | default: site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">

    <script>
        if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && !window.matchMedia('(prefers-color-scheme: light)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>

    <script>
        (function() {
            var s = localStorage.getItem('lang');
            if (!s) {
                var b = (navigator.language || 'en').slice(0, 2);
                s = (b === 'es') ? 'es' : 'en';
            }
            document.documentElement.setAttribute('lang', s);
            window.__lang = s;
        })();
    </script>

    <!-- SEO -->
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <meta name="author" content="Impulses App">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:title" content="{{ page.title | default: site.title }}">
    <meta property="og:description" content="{{ page.description | default: site.description }}">
    <meta property="og:image" content="{{ '/assets/images/screenshot-save-money.png' | absolute_url }}">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ page.title | default: site.title }}">
    <meta name="twitter:description" content="{{ page.description | default: site.description }}">
    <meta name="twitter:image" content="{{ '/assets/images/screenshot-save-money.png' | absolute_url }}">

    <!-- Apple App Store -->
    <meta name="apple-itunes-app" content="app-id=6754372500">

    <!-- CSS -->
    <link rel="stylesheet" href="{{ '/assets/css/output.css' | relative_url }}">

    <style>
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }
    </style>

    <link rel="icon" type="image/png" href="{{ '/favicon.png' | relative_url }}">

    <script src="{{ '/assets/js/i18n.js' | relative_url }}"></script>
    <script src="{{ '/assets/js/section-nav.js' | relative_url }}" defer></script>

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Impulses",
        "applicationCategory": "FinanceApplication",
        "operatingSystem": "iOS",
        "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "USD"
        },
        "description": "Stop overspending. Save money. Build mindful spending habits with waiting periods, streaks, and savings tracking.",
        "downloadUrl": "https://apps.apple.com/us/app/impulses-stop-impulse-buying/id6754372500",
        "image": "{{ '/assets/images/screenshot-save-money.png' | absolute_url }}",
        "author": {
            "@type": "Organization",
            "name": "Impulses App"
        }
    }
    </script>
</head>

<body class="font-sans">

    <a href="#main-content"
        class="sr-only focus:not-sr-only focus:absolute focus:top-4 focus:left-4 focus:z-50 focus:px-4 focus:py-2 focus:bg-zinc-900 focus:text-white focus:rounded-lg focus:outline-none"
        data-i18n="nav.skip">
        Skip to main content
    </a>

    {{ content }}

    <script>
        var themeToggleBtn = document.getElementById('theme-toggle');
        if (themeToggleBtn) {
            themeToggleBtn.addEventListener('click', function () {
                if (localStorage.getItem('color-theme')) {
                    if (localStorage.getItem('color-theme') === 'light') {
                        document.documentElement.classList.add('dark');
                        localStorage.setItem('color-theme', 'dark');
                    } else {
                        document.documentElement.classList.remove('dark');
                        localStorage.setItem('color-theme', 'light');
                    }
                } else {
                    if (document.documentElement.classList.contains('dark')) {
                        document.documentElement.classList.remove('dark');
                        localStorage.setItem('color-theme', 'light');
                    } else {
                        document.documentElement.classList.add('dark');
                        localStorage.setItem('color-theme', 'dark');
                    }
                }
            });
        }

        // Language: apply on load if not English
        if (window.__lang && window.__lang !== 'en') {
            window.applyLanguage(window.__lang);
        }
        window.updateLangToggleLabels(window.__lang || 'en');

        // Language toggle handler
        document.querySelectorAll('.lang-toggle').forEach(function(btn) {
            btn.addEventListener('click', function() {
                var next = (window.__lang === 'en') ? 'es' : 'en';
                window.applyLanguage(next);
            });
        });
    </script>
</body>

</html>
